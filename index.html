<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>OKB · Restricted</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#08295F;--or:#F26522;--or2:#FF8A47;--mut:#5B6B82;--line:#E3E8F0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;padding:20px;font:16px/1.45 Inter,system-ui,sans-serif;color:#0B1B33;background:#EEF2F7;background-image:radial-gradient(#D5DDE9 1.4px,transparent 1.5px);background-size:24px 24px}
.card{width:min(440px,100%);background:#fff;border-radius:26px;padding:34px 30px 30px;box-shadow:0 24px 60px rgba(8,41,95,.18);text-align:center;animation:rise .6s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.logos{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:14px}
.logos img{height:64px}
.eb{font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--navy)}
.eb b{color:var(--or)}
h1{margin:6px 0 4px;font:800 34px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--navy)}
h1 em{font-style:normal;color:var(--or)}
p{margin:0 0 22px;color:var(--mut);font-size:15px}
.lock{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--or2),var(--or));box-shadow:0 10px 22px rgba(242,101,34,.35)}
.lock svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
form{display:flex;flex-direction:column;gap:12px}
input{height:50px;border:2px solid var(--line);border-radius:14px;padding:0 16px;font:500 17px Inter,sans-serif;text-align:center;outline:none;background:#F7F9FC;transition:border-color .25s,box-shadow .25s}
input:focus{border-color:var(--or);box-shadow:0 0 0 4px rgba(242,101,34,.15);background:#fff}
button{height:50px;border:0;border-radius:14px;font:700 20px 'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#1658C2,var(--navy));box-shadow:0 10px 24px rgba(8,41,95,.3);cursor:pointer;transition:transform .2s,opacity .2s}
button:active{transform:scale(.98)}button[disabled]{opacity:.7}
.msg{min-height:22px;font-size:14px;font-weight:600;color:#C0392B}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{margin-top:16px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logos"><img src="dpwh.png" alt="DPWH" onerror="this.remove()"><img src="okb-logo.png" alt="Oplan Kontra Baha" onerror="this.remove()"></div>
  <div class="lock"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <div class="eb">Bureau of <b>Equipment</b></div>
  <h1>Restricted <em>document</em></h1>
  <p>For authorized personnel only. Enter the password you received separately.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autofocus>
    <button id="go" type="submit">Unlock</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="foot">DPWH · OKB Task Force Secretariat</div>
</div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const out=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},key,b64(P.c));
  return new TextDecoder().decode(out);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),pw=document.getElementById('pw'),msg=document.getElementById('msg'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();if(!pw.value)return;
  go.disabled=true;go.textContent='Unlocking…';msg.textContent='';
  try{const html=await unlock(pw.value);try{sessionStorage.setItem('okbq',pw.value)}catch(_){}show(html)}
  catch(err){go.disabled=false;go.textContent='Unlock';msg.textContent='Wrong password. Please try again.';
    const c=document.getElementById('card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');pw.select()}
});
(async()=>{let s=null;try{s=sessionStorage.getItem('okbq')}catch(_){}if(s){try{show(await unlock(s))}catch(_){try{sessionStorage.removeItem('okbq')}catch(e){}}}})();
})();
